worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 10240;
}

http {
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;

    # 上传大小上限提到 http 级，所有 location 均生效（默认 1m 会导致大文件 413）
    client_max_body_size 1000m;

    # ============ 全平台上传白名单 ============
    # 严格控制测试平台允许的文件类型（与产品决策一致）：
    #   文档: xlsx xls xlsb csv docx doc pdf ppt pptx wps
    #   图片: png jpeg jpg jfif bmp
    #   压缩: rar zip gzip tar
    #   文本/技术: txt json sql xml jmx xmind
    #   可执行: jar  (注意：jar 为可执行 Java 包，建议仅性能测试上传入口使用)
    # 不含：gif mp4 webp tif tiff 7z tgz log md yaml yml 等
    init_by_lua_block {
        ALLOWED_EXTS = {
            -- 通用办公文档
            [".xlsx"] = true, [".xls"] = true, [".xlsb"] = true, [".csv"] = true,
            [".docx"] = true, [".doc"] = true, [".pdf"] = true,
            [".ppt"]  = true, [".pptx"] = true, [".wps"] = true,
            -- 图片
            [".png"]  = true, [".jpeg"] = true, [".jpg"] = true,
            [".jfif"] = true, [".bmp"] = true,
            -- 压缩文件
            [".rar"]  = true, [".zip"] = true, [".gzip"] = true, [".tar"] = true,
            -- 文本及测试技术文件
            [".txt"]  = true, [".json"] = true, [".sql"] = true, [".xml"] = true,
            [".jmx"]  = true, [".xmind"] = true,
            -- 可执行（建议仅限性能测试入口）
            [".jar"]  = true,
        }
    }

    server {
        listen 8081;
        server_name localhost;

        proxy_connect_timeout  300;
        proxy_send_timeout     300;
        proxy_read_timeout     300;
        send_timeout           300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ============ 全平台拦截：对所有请求检查，但只对 multipart 上传校验 ============
        access_by_lua_block {
            local content_type = ngx.var.http_content_type
            -- 非 multipart 请求（GET/API/JSON）直接放行
            if not content_type or not string.find(content_type, "multipart/form%-data") then
                return true
            end

            ngx.req.read_body()
            local body = ngx.req.get_body_data()
            if not body then
                local tmp_file = ngx.req.get_body_file()
                if tmp_file then
                    local f = io.open(tmp_file, "r")
                    if f then
                        body = f:read("*all")
                        f:close()
                    end
                end
            end
            if not body then
                ngx.status = 400
                ngx.say('{"success":false,"message":"无法读取上传内容"}')
                return ngx.exit(400)
            end

            -- 遍历所有文件 part 的 filename（兼容 file/bodyFile/signature/files 等字段名）
            local rejected = nil
            for fn in body:gmatch('filename="([^"]*)"') do
                if fn and fn ~= "" then
                    local ext = fn:lower():match("%.([^.]+)$")
                    if not ext then
                        rejected = "无法识别文件类型: " .. fn
                        break
                    end
                    ext = "." .. ext
                    if not ALLOWED_EXTS[ext] then
                        rejected = "不允许上传该类型文件: " .. fn
                        break
                    end
                end
            end

            if rejected then
                ngx.log(ngx.INFO, "File rejected: ", rejected)
                ngx.status = 400
                ngx.say('{"success":false,"message":"' .. rejected .. '，请联系管理员"}')
                return ngx.exit(400)
            end

            ngx.log(ngx.INFO, "Upload allowed, passing through")
        }

        # 所有请求转发到宿主机 gateway（control-panel 起的 localhost:8000）
        location / {
            proxy_pass http://host.docker.internal:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
